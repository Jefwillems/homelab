# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
  namespace: homepage
spec:
  description: >-
    Default-deny policy for the homepage namespace.
    Homepage is a self-hosted dashboard with widgets that poll every internal
    cluster service for status and health data. It requires ingress from the
    Cilium Gateway on port 3000, metrics scraping from observability, egress to
    all cluster pods on any port (for service widgets), and egress to the
    internet on port 443 for any widgets that fetch external data.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: homepage

  ingress:
    # Cilium Gateway routes external traffic to the Homepage dashboard
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateway
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP

    # Allow Prometheus (observability namespace) to scrape metrics on any port
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability

  egress:
    # Homepage widgets poll internal services across all namespaces for status
    - toEntities:
        - cluster

    # Homepage widgets that fetch external data (e.g. weather, news feeds)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
