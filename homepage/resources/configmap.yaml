apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |
    layout:
      Media:
        style: row
        columns: 4
      Utilities:
        style: row
        columns: 4
      Cluster Management:
        style: row
        columns: 4
  custom.css: ''
  custom.js: ''
  proxmox.yaml: ''
  bookmarks.yaml: |
    - Developer:
        - Homelab repository:
            - abbr: GH
              href: https://github.com/Jefwillems/homelab
              icon: sh-github.svg
  services.yaml: ''
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ''
