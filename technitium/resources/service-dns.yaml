# DNS endpoint exposed on the LAN via a Cilium L2-announced LoadBalancer IP.
# externalTrafficPolicy: Local preserves the client source IP so Technitium can
# apply per-client rules and log real LAN addresses.
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  labels:
    app.kubernetes.io/name: technitium
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
