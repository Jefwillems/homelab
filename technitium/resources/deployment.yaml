apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  labels:
    app.kubernetes.io/name: technitium
spec:
  replicas: 1
  # Config lives on a RWO PersistentVolume, so never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium
    spec:
      securityContext:
        # Technitium persists its config under /etc/dns and must own it.
        fsGroup: 0
      containers:
        - name: technitium
          image: technitium/dns-server:15.4.0
          imagePullPolicy: IfNotPresent
          env:
            # First-boot bootstrap. Most of these are (re)applied on each start.
            - name: DNS_SERVER_DOMAIN
              value: technitium.jef.app
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-admin
                  key: password
            - name: DNS_SERVER_WEB_SERVICE_HTTP_PORT
              value: '5380'
            # Serve LAN clients; recurse only for private (LAN) networks.
            - name: DNS_SERVER_RECURSION
              value: AllowOnlyForPrivateNetworks
            # Forward straight to public resolvers (plain UDP/TCP by IP) so the
            # pod never depends on CoreDNS for upstream resolution — this avoids
            # the private-PTR feedback loop that plagued AdGuard.
            - name: DNS_SERVER_FORWARDERS
              value: 1.1.1.1, 8.8.8.8
            - name: DNS_SERVER_FORWARDER_PROTOCOL
              value: Tcp
            # Built-in blocking with a starter blocklist (tune in the UI later).
            - name: DNS_SERVER_ENABLE_BLOCKING
              value: 'true'
            - name: DNS_SERVER_BLOCK_LIST_URLS
              value: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
            - name: DNS_SERVER_LOG_USING_LOCAL_TIME
              value: 'true'
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 5380
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # Intentionally NO cpu limit: DNS is latency-sensitive and a CPU
            # limit causes CFS throttling under bursty load (the exact alert we
            # saw on AdGuard). Memory is capped instead.
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/dns
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium-config
