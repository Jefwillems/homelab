name: Renovate

on:
  # Run on a schedule so PRs stay up to date automatically.
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  # Allow manual runs from the Forgejo UI, with an optional dry-run toggle.
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Run Renovate in dry-run mode (no branches/PRs are created)'
        type: boolean
        default: false
  # Re-run immediately when the Renovate config or this workflow changes.
  push:
    branches: [main]
    paths:
      - '.forgejo/workflows/renovate.yaml'
      - 'renovate.json'

jobs:
  renovate:
    # Adjust the label to match a runner registered against your Forgejo instance.
    runs-on: codeberg-medium
    container:
      image: ghcr.io/renovatebot/renovate:43
    steps:
      - name: Run Renovate
        run: renovate
        env:
          # Codeberg runs Forgejo, which Renovate talks to via its Gitea-compatible API.
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://codeberg.org/api/v1/
          # Forgejo/Codeberg access token with repo + PR write scope. Store it as a
          # repository/organization Actions secret named RENOVATE_TOKEN.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Only manage this repository (Renovate auto-detects the committed renovate.json).
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: 'Jefwillems/homelab'
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate-bot@jef.app>'
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == 'true' }}
          # Optional: a github.com read-only token avoids rate limits when fetching
          # release notes/changelogs. Store as a secret named GITHUB_COM_TOKEN.
          GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          LOG_LEVEL: info
