# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd
  namespace: argocd
spec:
  description: >-
    Default-deny policy for the argocd namespace.
    ArgoCD requires ingress from the Cilium Gateway for the web UI (port 80),
    intra-namespace traffic for internal component communication (repo-server,
    redis, dex), and metrics scraping from observability. Egress is needed to
    the internet for git operations (codeberg.org, OIDC discovery), to
    pocket-id for OIDC token exchange, to kube-apiserver for cluster resource
    management, and intra-namespace for internal component communication.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: argocd

  ingress:
    # Cilium Gateway routes external UI traffic to the ArgoCD server (HTTP)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateway
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP

    # Allow Prometheus (observability namespace) to scrape ArgoCD metrics endpoints
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '8082'
              protocol: TCP
            - port: '8083'
              protocol: TCP
            - port: '8084'
              protocol: TCP

    # Intra-namespace: repo-server (8081), redis (6379), dex (5556), and any
    # other internal component-to-component communication
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd

  egress:
    # Git sync (codeberg.org) and OIDC discovery endpoint (both HTTPS)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

    # OIDC token exchange with Pocket ID
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: pocket-id
      toPorts:
        - ports:
            - port: '1411'
              protocol: TCP

    # ArgoCD application controller manages Kubernetes resources via kube-apiserver
    - toEntities:
        - kube-apiserver

    # Intra-namespace: repo-server (8081), redis (6379), dex (5556), and any
    # other internal component-to-component communication
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
