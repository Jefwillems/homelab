# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-repo
  labels:
    argocd.argoproj.io/secret-type: repository
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  target:
    name: homelab-repo
  dataFrom:
    - find:
        path: /argocd
        name:
          regexp: repo_.*
      rewrite:
        - regexp:
            source: "repo_(.*)"
            target: "$1"
