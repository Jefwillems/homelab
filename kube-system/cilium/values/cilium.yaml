kubeProxyReplacement: true

l2announcements:
  enabled: false

bgpControlPlane:
  enabled: true

ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
k8sServiceHost: 'localhost'
k8sServicePort: 7445
hubble:
  enabled: true
  relay:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_dashboard: '1'

cgroup:
  autoMount:
    enabled: false
  hostRoot: '/sys/fs/cgroup'

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
envoy:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

dashboards:
  enabled: true
