# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - git:
        repoURL: 'https://codeberg.org/Jefwillems/homelab'
        revision: HEAD
        directories:
          - path: '*'
  template:
    metadata:
      name: '{{ .path.basename }}-app'
    spec:
      source:
        repoURL: 'https://codeberg.org/Jefwillems/homelab'
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      project: 'default'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          enabled: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
