# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
  description: >-
    Default-deny policy for the local-path-provisioner namespace.
    local-path-provisioner watches PersistentVolumeClaims and manages
    PersistentVolumes via kube-apiserver, and performs node-local filesystem
    operations which require access to the host. No inbound service traffic is
    expected; ingress is limited to kubelet health probes from the host and
    optional Prometheus scraping from the observability namespace.
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: local-path-storage

  ingress:
    # Kubelet liveness/readiness probes from the node
    - fromEntities:
        - host

    # Allow Prometheus (observability namespace) to scrape metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability

  egress:
    # Watch and update PersistentVolume/PersistentVolumeClaim resources
    - toEntities:
        - kube-apiserver

    # Node-local filesystem operations (bind-mount provisioning on host paths)
    - toEntities:
        - host
