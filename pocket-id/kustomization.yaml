apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pocket-id

helmCharts:
  - name: pocket-id-operator
    version: 0.14.3
    repo: oci://ghcr.io/aclerici38/charts
    includeCRDs: true
    valuesFile: ./values.yaml

resources:
  - ./resources/namespace.yaml
  - ./resources/instance.yaml
  - ./resources/default-user.yaml
  - ./resources/platform-owners-group.yaml
  - ./resources/pocket-id-encryption-secret.yaml
  - ./resources/proton-smtp-secret.yaml
  - ./resources/primary-users.yaml

patches:
  - patch: |
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
    target:
      kind: Deployment
      name: pocket-id-operator
      namespace: pocket-id
