apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pocket-id

helmCharts:
  - name: pocket-id-operator
    version: 0.9.0
    repo: oci://ghcr.io/aclerici38/charts/
    includeCRDs: true
    valuesInline:
      instance:
        enabled: false

resources:
  - ./bases/instance.yaml
  - ./bases/default-user.yaml
  - ./bases/platform-owners-group.yaml
