# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:bfe9bd9b188b66b269a3a2944e594280b7c194e3f60ddd67ef5e7c55abe2f65f
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-encryption
        key: key
  appUrl: 'https://id.jef.app'
  analyticsDisabled: true
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  trustedProxies:
    enabled: true
  emailNotifications:
    apiKeyExpiration: true
    loginNotification: true
    oneTimeAccessAsAdmin: true
    verification: true
  metrics:
    enabled: true
  smtp:
    from: willems@jef.app
    host: smtp.protonmail.ch
    port: 587
    tls: starttls
    user: willems@jef.app
    password:
      valueFrom:
        secretKeyRef:
          name: proton-smtp
          key: token
  route:
    enabled: true
    annotations:
      gethomepage.dev/description: Pocket ID authentication
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: Cluster Management
      gethomepage.dev/icon: sh-pocket-id.svg
      gethomepage.dev/name: Pocket ID
    hostnames:
      - 'id.jef.app'
    parentRefs:
      - name: homelab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway
