# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  image: ghcr.io/pocket-id/pocket-id:v2.19.2-distroless@sha256:7b1231ff19150d2003ab4e2f26c363c812e051ac5df6f27e5e3835f9781890fb
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-encryption
        key: key
  appUrl: 'https://id.jef.app'
  analyticsDisabled: true
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  trustedProxies:
    enabled: true
  emailNotifications:
    apiKeyExpiration: true
    loginNotification: true
    oneTimeAccessAsAdmin: true
    verification: true
  metrics:
    enabled: true
  smtp:
    from: willems@jef.app
    host: smtp.protonmail.ch
    port: 587
    tls: starttls
    user: willems@jef.app
    password:
      valueFrom:
        secretKeyRef:
          name: proton-smtp
          key: token
  route:
    enabled: true
    annotations:
      gethomepage.dev/description: Pocket ID authentication
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: Cluster Management
      gethomepage.dev/icon: sh-pocket-id.svg
      gethomepage.dev/name: Pocket ID
    hostnames:
      - 'id.jef.app'
    parentRefs:
      - name: homelab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway
