# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-encryption
        key: key
  appUrl: 'https://id.home.jef.app'
  analyticsDisabled: true
  route:
    enabled: true
    hostnames:
      - 'id.home.jef.app'
    parentRefs:
      - name: lab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway
