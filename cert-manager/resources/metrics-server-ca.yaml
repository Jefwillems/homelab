# Internal self-signed CA used to issue the metrics-server aggregation-API
# serving certificate (v1beta1.metrics.k8s.io). This is NOT the public
# letsencrypt-prod issuer, which is ACME/DNS-01 and cannot sign an internal
# APIService certificate.
#
# Chain:
#   selfsigned (ClusterIssuer)  ->  metrics-server-ca (CA Certificate)
#                               ->  metrics-server-ca (ClusterIssuer, kind: CA)
#
# The metrics-server Helm chart references the `metrics-server-ca` ClusterIssuer
# and cert-manager's ca-injector populates the APIService caBundle.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: metrics-server-ca
  # Must live in cert-manager's cluster-resource namespace so the CA
  # ClusterIssuer below can read the resulting secret.
  namespace: cert-manager
spec:
  isCA: true
  commonName: metrics-server-ca
  secretName: metrics-server-ca-tls
  duration: 87600h # 10y
  renewBefore: 720h # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: metrics-server-ca
spec:
  ca:
    secretName: metrics-server-ca-tls
