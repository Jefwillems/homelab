sources:
  - gateway-httproute

# RFC2136 dynamic DNS updates against Technitium's primary `jef.app` zone.
# Technitium hosts `jef.app` as a Primary zone and accepts TSIG-secured dynamic
# updates + zone transfers (AXFR) from the `externaldns` key. See README.
provider:
  name: rfc2136

extraArgs:
  # Send updates to the Technitium DNS service (both UDP+TCP 53 exposed).
  - --rfc2136-host=technitium-dns.technitium.svc.cluster.local
  - --rfc2136-port=53
  - --rfc2136-zone=jef.app
  # TSIG auth. The secret itself is injected via env (EXTERNAL_DNS_RFC2136_TSIG_SECRET).
  - --rfc2136-tsig-keyname=externaldns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  # List existing records via authenticated zone transfer.
  - --rfc2136-tsig-axfr

# TSIG shared secret (base64, as generated by Technitium) — kept out of git.
# Create with:
#   kubectl -n external-dns create secret generic technitium-rfc2136 \
#     --from-literal=tsig-secret='<base64-tsig-secret-from-technitium>'
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: technitium-rfc2136
        key: tsig-secret
