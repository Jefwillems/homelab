# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns
  namespace: external-dns
  description: >-
    Default-deny policy for the external-dns namespace.
    external-dns watches Kubernetes HTTPRoute resources via kube-apiserver
    and pushes DNS rewrites to AdGuard Home in the adguard namespace on
    port 80. Metrics are exposed on port 7979.
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: external-dns

  ingress:
    # Allow Prometheus (observability namespace) to scrape metrics on port 7979
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '7979'
              protocol: TCP

  egress:
    # Push DNS rewrite records to AdGuard Home API
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: adguard
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP

    # Watch Gateway HTTPRoute resources via kube-apiserver
    - toEntities:
        - kube-apiserver
