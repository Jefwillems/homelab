apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-manager
  labels:
    app.kubernetes.io/name: vault-manager
spec:
  # 03:00 daily — after the user has stopped editing for the night.
  schedule: "0 3 * * *"
  timeZone: Europe/Brussels
  # Never run two passes at once; a pass mutates the vault on the shared PVC.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt per night; the CronJob retries tomorrow. Avoids burning
      # Copilot quota on repeated failures.
      backoffLimit: 0
      # Hard ceiling in case the agent wedges; the app also self-limits via
      # RUN_TIMEOUT and honours SIGTERM.
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-manager
        spec:
          restartPolicy: Never
          securityContext:
            # Match the livesync-bridge uid/gid so files written by the agent on
            # the shared local-path PVC are owned consistently and stay writable
            # by the bridge.
            runAsUser: 1993
            runAsGroup: 1993
            fsGroup: 1993
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vault-manager
              # Pinned by digest for reproducibility (tag: latest). Bump when a
              # new image is published; resolve via the CI run's digest output
              # or `docker/registry` inspect.
              image: ghcr.io/jefwillems/vault-manager@sha256:b12fbf8a8571d4a0b8e20dfac55e284fc68cd8522360f890a4c6415eebbe7e99
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: VAULT_PATH
                  value: /app/data/vault
                - name: BRAINDUMP_DIR
                  value: Braindumps
                - name: COPILOT_MODEL
                  value: claude-sonnet-4.5
                # COPILOT_REASONING_EFFORT is intentionally unset: claude-sonnet-4.5
                # (via the Copilot API) rejects an explicit reasoning-effort value.
                # Only set it for models that models.list reports as supporting it.
                - name: RUN_TIMEOUT
                  value: 45m
                - name: LOG_LEVEL
                  value: info
                # --- metrics -------------------------------------------------
                # vault-manager is a short-lived Job and can't be scraped, so it
                # pushes its run outcome to the Pushgateway in the observability
                # namespace (Prometheus scrapes the gateway via ServiceMonitor).
                - name: PUSHGATEWAY_URL
                  value: http://prometheus-pushgateway.observability.svc.cluster.local:9091
                - name: PUSHGATEWAY_JOB
                  value: vault-manager
                # "instance" grouping label — use the pod name so retries/parallel
                # runs don't overwrite each other's samples on the gateway.
                - name: INSTANCE_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                # Writable HOME/cache so the SDK can extract the embedded
                # Copilot CLI and store session state (the image default HOME is
                # owned by a different uid than we run as here).
                - name: HOME
                  value: /home/app
                - name: XDG_CACHE_HOME
                  value: /home/app/.cache
                - name: COPILOT_GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vault-manager-copilot
                      key: token
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: vault-workspace
                  mountPath: /app/data
                - name: home
                  mountPath: /home/app
          volumes:
            - name: vault-workspace
              persistentVolumeClaim:
                claimName: vault-workspace
            - name: home
              emptyDir: {}
