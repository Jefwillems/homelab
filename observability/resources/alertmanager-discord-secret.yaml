# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  target:
    name: alertmanager-discord
  dataFrom:
    - find:
        path: /observability
        name:
          regexp: .*
      rewrite:
        - regexp:
            source: "discord_(.*)"
            target: "$1"
