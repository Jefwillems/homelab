apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global
  namespace: observability
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: discord-warning
    routes:
      # Watchdog is an always-firing dead-man's switch — swallow it locally.
      # (Phase 6: forward to an external heartbeat monitor instead.)
      - receiver: 'null'
        matchers:
          - name: alertname
            value: Watchdog
            matchType: '='
      # Critical alerts get their own receiver (own channel/mention).
      - receiver: discord-critical
        matchers:
          - name: severity
            value: critical
            matchType: '='
  # Silence warning-level noise for a resource that already has a critical
  # alert firing, to cut duplicate notifications.
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: '='
      targetMatch:
        - name: severity
          value: warning
          matchType: '='
      equal: ['alertname', 'namespace']
  receivers:
    - name: 'null'
    - name: discord-critical
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: webhook-url
          sendResolved: true
    - name: discord-warning
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: webhook-url
          sendResolved: true
