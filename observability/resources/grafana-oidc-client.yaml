# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidoidcclient_v1alpha1.json
# Pocket ID OIDC client for Grafana. The operator provisions the referenced
# secret (grafana-oidc) in this namespace; Grafana consumes client_id /
# client_secret from it via envValueFrom (see values/values.yaml).
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
spec:
  callbackUrls:
    - 'https://grafana.jef.app/login/generic_oauth'
  logoutCallbackUrls:
    - 'https://grafana.jef.app/login'
  pkceEnabled: true
  requiresReauthentication: false
  launchUrl: 'https://grafana.jef.app/'
  secret:
    name: grafana-oidc
    additionalLabels:
      app.kubernetes.io/part-of: observability
    keys:
      clientID: client_id
      clientSecret: client_secret
      issuerUrl: issuer_url
      discoveryUrl: discovery_url
