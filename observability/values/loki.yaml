deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 336h # 14d
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_series: 5000
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Pattern ingester / ruler not needed for basic log storage.
  pattern_ingester:
    enabled: false

# Single StatefulSet holds ingester + querier + everything.
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Scalable targets unused in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# nginx front for read+write on a stable `loki-gateway` service.
gateway:
  enabled: true
  replicas: 1

# Drop the heavy/optional extras (memcached, canary, minio, self-test).
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
