# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  # Create a Secret named "grafana-admin-secret" in the observability namespace
  # with keys admin-user and admin-password before deploying.
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 2Gi

  # TLS is terminated at the Gateway — Grafana serves plain HTTP internally
  service:
    type: ClusterIP

  ingress:
    enabled: false

  grafana.ini:
    server:
      root_url: https://grafana.jef.app
    auth:
      disable_login_form: false

  # Sidecar watches for ConfigMaps labelled grafana_dashboard="1" across all
  # namespaces and hot-loads them into Grafana automatically.
  # Cilium/Hubble dashboards are created by the Cilium chart using this label.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: '1'

  # Dashboards loaded directly from grafana.com at startup.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/community

  dashboards:
    community:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus

  # Pre-load the Loki datasource when Loki is added later
  additionalDataSources: []

# ── Prometheus ─────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 20Gi

    # Discover ServiceMonitors / PodMonitors / ProbeMonitors across ALL namespaces
    # (not just those created by this chart). Required to pick up Cilium, ArgoCD,
    # AdGuard, cert-manager, etc.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

  service:
    type: ClusterIP

# ── Alertmanager ───────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 1Gi

    # Mounts Secret "alertmanager-discord" at
    # /etc/alertmanager/secrets/alertmanager-discord/. Create it out-of-band:
    #   kubectl create secret generic alertmanager-discord \
    #     --from-literal=webhook-url="$DISCORD_WEBHOOK_URL" -n observability
    # (see README). Keeping the URL in a Secret avoids committing it to git.
    secrets:
      - alertmanager-discord

  service:
    type: ClusterIP

  # Full Alertmanager configuration. Replaces the chart's default null route so
  # the built-in Prometheus/node alert rules are actually delivered.
  config:
    global:
      resolve_timeout: 5m
    route:
      # Group related alerts into a single notification.
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: discord-warning
      routes:
        # Watchdog is an always-firing dead-man's switch — swallow it locally.
        # (Phase 6: forward to an external heartbeat monitor instead.)
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Critical alerts get their own receiver (own channel/mention).
        - receiver: discord-critical
          matchers:
            - severity = "critical"
    # Silence warning-level noise for a resource that already has a critical
    # alert firing, to cut duplicate pages.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'namespace']
    receivers:
      - name: 'null'
      - name: discord-critical
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
      - name: discord-warning
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true

# ── Node Exporter ──────────────────────────────────────────────────────────────
# hostRootFsMount must be disabled on Talos — the root filesystem is immutable
# and mounted differently from a standard Linux node.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$

# ── kube-state-metrics ─────────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true

# ── Disabled — not accessible by default on Talos ──────────────────────────────
# These components bind to localhost on Talos control plane nodes and are not
# reachable by Prometheus without additional machine config changes.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

# Cilium replaces kube-proxy — disable the scrape target entirely.
kubeProxy:
  enabled: false
