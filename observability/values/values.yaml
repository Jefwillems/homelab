# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  # Create a Secret named "grafana-admin-secret" in the observability namespace
  # with keys admin-user and admin-password before deploying.
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    size: 2Gi

  # TLS is terminated at the Gateway — Grafana serves plain HTTP internally
  service:
    type: ClusterIP

  ingress:
    enabled: false

  grafana.ini:
    server:
      root_url: https://grafana.jef.app
    auth:
      disable_login_form: false

  # Sidecar watches for ConfigMaps labelled grafana_dashboard="1" across all
  # namespaces and hot-loads them into Grafana automatically.
  # Cilium/Hubble dashboards are created by the Cilium chart using this label.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: '1'

  # Dashboards loaded directly from grafana.com at startup.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/community

  dashboards:
    community:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus

  # Loki datasource (logs). Prometheus is provisioned by the chart as default.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      jsonData:
        maxLines: 1000

# ── Prometheus ─────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 20Gi

    # Discover ServiceMonitors / PodMonitors / ProbeMonitors across ALL namespaces
    # (not just those created by this chart). Required to pick up Cilium, ArgoCD,
    # AdGuard, cert-manager, etc.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

  service:
    type: ClusterIP

# ── Alertmanager ───────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    # Public URL (via the gateway HTTPRoute) so generated links resolve correctly.
    externalUrl: https://alertmanager.jef.app
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 1Gi

    # Use the AlertmanagerConfig CRD in resources/alertmanager-config.yaml as the
    # top-level configuration. The CRD lets the Prometheus Operator read the
    # Discord webhook straight from the alertmanager-discord Secret (apiURL),
    # which keeps the URL out of git. A raw `config:` with `webhook_url_file`
    # is rejected by prometheus-operator (it doesn't know that discord field).
    alertmanagerConfiguration:
      name: alertmanager-global

  service:
    type: ClusterIP

# ── Node Exporter ──────────────────────────────────────────────────────────────
# hostRootFsMount must be disabled on Talos — the root filesystem is immutable
# and mounted differently from a standard Linux node.
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$

# ── kube-state-metrics ─────────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true

# ── Control-plane scrape targets ───────────────────────────────────────────────
# Enabled after exposing metrics via Talos machine config (controlplane.yaml):
#   controllerManager/scheduler  bind-address: 0.0.0.0
#   etcd                         listen-metrics-urls: http://0.0.0.0:2381
# Endpoints are pinned to the control-plane node IP because the components run as
# host-network static pods / Talos services rather than label-selectable pods.
kubeControllerManager:
  enabled: true
  endpoints:
    - 192.168.178.109
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  endpoints:
    - 192.168.178.109
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.178.109
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http

# Cilium replaces kube-proxy — disable the scrape target entirely.
kubeProxy:
  enabled: false
