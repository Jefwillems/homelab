apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  labels:
    app.kubernetes.io/name: renovate
spec:
  # Daily at 02:00. Renovate reads the committed renovate.json from the repo itself.
  schedule: '0 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Clean the Job up an hour after it finishes.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.50.3
              args:
                - Jefwillems/homelab
                - Jefwillems/dropper
                - Jefwillems/vault-manager
                - Jefwillems/livesync-bridge-image
              env:
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: 'false'
                - name: RENOVATE_GIT_AUTHOR
                  value: 'Renovate Bot <renovate-bot@jef.app>'
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secret
                      key: RENOVATE_TOKEN
                - name: RENOVATE_GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secret
                      key: GITHUB_COM_TOKEN
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
