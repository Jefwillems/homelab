route:
  main:
    enabled: true
    annotations:
      gethomepage.dev/description: Indexer manager
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: Media
      gethomepage.dev/icon: sh-prowlarr-radarr.svg
      gethomepage.dev/name: Prowlarr
      gethomepage.dev/weight: '11'
    hostnames:
      - prowlarr.jef.app
    parentRefs:
      - name: homelab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway

workload:
  main:
    podSpec:
      containers:
        main:
          env:
             # External | Basic | Forms
            PROWLARR__AUTH__METHOD: "Forms"
            # DisabledForLocalAddresses | Enabled
            PROWLARR__AUTH__REQUIRED: "Enabled"


persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    size: 1Gi
    accessMode: ReadWriteOnce

env:
  TZ: 'Europe/Brussels'
