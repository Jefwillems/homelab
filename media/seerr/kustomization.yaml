apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: seerr-chart
    releaseName: seerr
    repo: oci://ghcr.io/seerr-team/seerr
    version: 3.8.0
    valuesFile: values.yaml

patches:
  - patch: |
      - op: add
        path: /spec/rules/0/backendRefs/0/kind
        value: Service
      - op: add
        path: /spec/rules/0/backendRefs/0/group
        value: ''
      - op: add
        path: /spec/rules/0/backendRefs/0/weight
        value: 1
    target:
      kind: HTTPRoute
      name: seerr-seerr-chart
