apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: qbittorrent
    releaseName: qbittorrent
    repo: oci://oci.trueforge.org/truecharts
    version: 25.10.0
    valuesFile: values.yaml

patches:
  - patch: |
      - op: add
        path: /spec/rules/0/backendRefs/0/kind
        value: Service
      - op: add
        path: /spec/rules/0/backendRefs/0/group
        value: ''
      - op: add
        path: /spec/rules/0/backendRefs/0/weight
        value: 1
      - op: replace
        path: /apiVersion
        value: "gateway.networking.k8s.io/v1"
    target:
      kind: HTTPRoute
      name: qbittorrent
  - patch: |
      - op: add
        path: /metadata/annotations/lbipam.cilium.io~1ips
        value: "192.168.99.113"
    target:
      kind: Service
      name: qbittorrent-torrent
