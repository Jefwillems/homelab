route:
  main:
    enabled: true
    annotations:
      gethomepage.dev/description: Torrent client
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: Media
      gethomepage.dev/icon: sh-qbittorrent.svg
      gethomepage.dev/name: qBittorrent
    hostnames:
      - qbittorrent.jef.app
    parentRefs:
      - name: homelab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway

# Promote the chart's built-in torrent service to LoadBalancer.
# The chart already defines 6881 TCP+UDP — only the type and IP need overriding.
service:
  torrent:
    type: LoadBalancer
    loadBalancerIP: '192.168.178.113'

persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    size: 1Gi
    accessMode: ReadWriteOnce
  data:
    enabled: true
    type: pvc
    existingClaim: media-data
    mountPath: /data

env:
  TZ: 'Europe/Brussels'
