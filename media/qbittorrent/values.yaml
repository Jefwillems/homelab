route:
  main:
    enabled: true
    annotations:
      gethomepage.dev/description: Torrent client
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: Media
      gethomepage.dev/icon: sh-qbittorrent.svg
      gethomepage.dev/name: qBittorrent
      gethomepage.dev/weight: '5'
      gethomepage.dev/widget.type: qbittorrent
      gethomepage.dev/widget.url: http://qbittorrent.media.svc.cluster.local:10095
      gethomepage.dev/widget.username: '{{ `{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}` }}'
      gethomepage.dev/widget.password: '{{ `{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}` }}'
    hostnames:
      - qbittorrent.jef.app
    parentRefs:
      - name: homelab-gateway
        namespace: gateway
        group: gateway.networking.k8s.io
        kind: Gateway

# Promote the chart's built-in torrent service to LoadBalancer.
# The chart already defines 6881 TCP+UDP — only the type and IP need overriding.
service:
  torrent:
    type: LoadBalancer

persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    size: 1Gi
    accessMode: ReadWriteOnce
  data:
    enabled: true
    type: pvc
    existingClaim: media-data
    mountPath: /data

env:
  TZ: 'Europe/Brussels'
