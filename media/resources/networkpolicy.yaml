# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media
  namespace: media
spec:
  description: >-
    Default-deny policy for the media namespace.
    Allows intra-namespace service communication (seerr→jellyfin/radarr/sonarr,
    radarr/sonarr→prowlarr/qbittorrent, bazarr→radarr/sonarr), ingress from
    the gateway namespace on each service's primary port, Prometheus scraping
    from the observability namespace on dedicated metrics ports, and egress to
    world on HTTPS (443) for metadata fetching (TMDB, TVDB, subtitle providers,
    etc.) and port 6881 TCP+UDP for qbittorrent torrent peer connections.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: media

  ingress:
    # Intra-namespace: services reach each other freely (seerr→jellyfin/radarr/sonarr,
    # radarr/sonarr→prowlarr/qbittorrent, bazarr→radarr/sonarr, etc.)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media

    # Prometheus scrapes dedicated metrics endpoints for each service
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: '6767' # bazarr (metrics same as service port)
              protocol: TCP
            - port: '7879' # radarr metrics
              protocol: TCP
            - port: '8096' # jellyfin (metrics same as service port)
              protocol: TCP
            - port: '8990' # sonarr metrics
              protocol: TCP
            - port: '9697' # prowlarr metrics
              protocol: TCP

  egress:
    # Intra-namespace: allow all inter-service calls within media
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media

    # HTTPS metadata fetching: TMDB/TVDB (radarr, sonarr, prowlarr, jellyfin)
    # and subtitle providers (bazarr)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP

    # qbittorrent torrent peer connections (BitTorrent default port)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: '6881'
              protocol: TCP
            - port: '6881'
              protocol: UDP
