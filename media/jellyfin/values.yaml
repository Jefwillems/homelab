httpRoute:
  enabled: true
  annotations:
    gethomepage.dev/description: Jellyfin media libraries
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyfin.png
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/weight: '1'
    gethomepage.dev/widget.type: jellyfin
    gethomepage.dev/widget.url: http://jellyfin.media.svc.cluster.local:8096
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_JELLYFIN_APIKEY}}'
  hostnames:
    - jellyfin.jef.app
  parentRefs:
    - name: homelab-gateway
      namespace: gateway
      group: gateway.networking.k8s.io
      kind: Gateway
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
persistence:
  media:
    existingClaim: media-data
    mountPath: /data
