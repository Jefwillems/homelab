# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: jellyfin
spec:
  callbackUrls:
    - 'https://jellyfin.jef.app/sso/OID/redirect/pocket-id'
  logoutCallbackUrls:
    - 'https://jellyfin.jef.app/'
  pkceEnabled: true
  requiresReauthentication: false
  launchUrl: 'https://jellyfin.jef.app/'
  allowedUserGroups:
    - name: platform-owners
      namespace: pocket-id
  secret:
    name: jellyfin-oidc
    additionalLabels:
      app.kubernetes.io/part-of: jellyfin
    keys:
      clientID: client_id
      clientSecret: client_secret
      issuerUrl: issuer_url
      discoveryUrl: discovery_url
