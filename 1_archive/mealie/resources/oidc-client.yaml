# $schema: https://github.com/aclerici38/pocket-id-operator/releases/latest/download/pocketidoidcclient_v1alpha1.json
# Pocket ID OIDC client for Mealie. The operator provisions the referenced
# secret (mealie-oidc) in this namespace; Mealie consumes client_id /
# client_secret / discovery_url from it via envValueFrom on the Deployment.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: mealie
spec:
  # Mealie's OIDC redirect target is <BASE_URL>/login.
  # https://docs.mealie.io/documentation/getting-started/installation/backend-config/#openid-connect-oidc
  callbackUrls:
    - 'https://mealie.jef.app/login'
  logoutCallbackUrls:
    - 'https://mealie.jef.app/'
  pkceEnabled: true
  requiresReauthentication: false
  secret:
    name: mealie-oidc
    additionalLabels:
      app.kubernetes.io/part-of: mealie
    keys:
      clientID: client_id
      clientSecret: client_secret
      issuerUrl: issuer_url
      discoveryUrl: discovery_url
