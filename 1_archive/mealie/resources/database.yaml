apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-db
spec:
  instances: 1
  imagePullPolicy: IfNotPresent

  bootstrap:
    initdb:
      database: mealie
      owner: mealie

  storage:
    size: 5Gi
    storageClass: local-path

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
