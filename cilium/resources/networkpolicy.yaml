# $schema: https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline
spec:
  description: >
    Cluster-wide baseline applied to every pod. Grants the minimum required
    for any pod to function: DNS resolution, kubelet health probes, and
    kube-apiserver access for service accounts.

    IMPORTANT — cilium.l7policy and the Cilium Gateway:
    The gateway Envoy contains a cilium.l7policy filter that enforces network
    policies. It uses the *original* client's security identity (not the
    proxy's) when checking the backend's ingress policy. LAN clients are
    classified as 'world'. Therefore:
      - ingress must include 'world' so gateway-forwarded requests are allowed
      - egress must include 'cluster' so the gateway can reach all backends
    Both rules are required; removing either breaks all gateway routes.
  endpointSelector: {}
  # ── INGRESS ──────────────────────────────────────────────────────────────
  ingress:
    # Kubelet liveness/readiness probes originate from the node itself.
    - fromEntities:
        - host
        - remote-node

    # Allow traffic from the Cilium Gateway (ingress entity).
    - fromEntities:
        - ingress

    # Allow external (LAN / internet) traffic. Required because the
    # cilium.l7policy filter in the gateway Envoy checks the original client
    # identity (world) against every backend's ingress policy. Without this
    # rule all gateway-forwarded requests would be denied with 403.
    - fromEntities:
        - world

    # Allow any cluster pod to send DNS queries to CoreDNS on port 53.
    # The CCNP puts CoreDNS itself into enforcement mode (endpointSelector: {}
    # matches all pods), so an explicit ingress rule is needed or CoreDNS
    # will drop queries from other pods.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY

  # ── EGRESS ───────────────────────────────────────────────────────────────
  egress:
    # CoreDNS (kube-dns) — every pod needs cluster DNS.
    # L7 DNS rules ('rules: dns') are intentionally omitted: they enable
    # Cilium's L7 proxy cluster-wide, which causes the gateway Envoy's
    # cilium.l7policy filter to enforce policies even more strictly and
    # block traffic to backends. Plain L4 is sufficient.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY

    # Allow egress to all cluster pods. The cilium.l7policy filter in the
    # gateway Envoy enforces the gateway's own egress policy when forwarding
    # requests to backends. Without this rule the gateway cannot reach any
    # backend service.
    - toEntities:
        - cluster

    # Kubernetes API server — needed by operators, controllers, and any pod
    # that mounts a service account token and uses it.
    - toEntities:
        - kube-apiserver
